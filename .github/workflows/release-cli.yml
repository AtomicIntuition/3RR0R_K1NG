name: Release CLI

on:
  push:
    tags:
      - 'cli-v*'
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: darwin-x64
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            name: darwin-arm64
            cross: false
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x64
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-arm64
            cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build with cross
        if: matrix.cross
        working-directory: error-king-cli
        run: |
          cross build --release --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/3rror ../3rror-${{ matrix.name }}

      - name: Build native
        if: '!matrix.cross'
        working-directory: error-king-cli
        run: |
          cargo build --release --target ${{ matrix.target }}
          mv target/${{ matrix.target }}/release/3rror ../3rror-${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 3rror-${{ matrix.name }}
          path: 3rror-${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release files
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            if [ -d "$dir" ]; then
              cp "$dir"/* release/ 2>/dev/null || true
            fi
          done
          chmod +x release/* 2>/dev/null || true
          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          if ls * 1> /dev/null 2>&1; then
            sha256sum * > checksums.txt
            cat checksums.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
