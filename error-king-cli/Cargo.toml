[package]
name = "crisp-cli"
version = "0.2.0"
edition = "2021"
description = "Crisp CLI — website audit tool. Security, performance, SEO & accessibility audits from your terminal."
authors = ["Crisp"]
license = "MIT"
repository = "https://github.com/AtomicIntuition/3RR0R_K1NG"
homepage = "https://crisp.sh"
keywords = ["website", "audit", "security", "performance", "seo"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "crisp"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# HTTP client (rustls for cross-compilation support)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal colors and styling
colored = "2.1"

# Progress indicators
indicatif = "0.17"

# Error handling
anyhow = "1.0"

# Text wrapping
textwrap = "0.16"

# URL encoding
urlencoding = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
