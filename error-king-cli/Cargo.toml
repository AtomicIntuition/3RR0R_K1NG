[package]
name = "error_king"
version = "0.1.3"
edition = "2021"
description = "CLI for 3RROR_K1NG - Website Roast Machine. Get your website brutally roasted with AI-powered security, performance, SEO & accessibility audits."
authors = ["3RROR_K1NG"]
license = "MIT"
repository = "https://github.com/AtomicIntuition/3RR0R_K1NG"
homepage = "https://3rrork1ng.com"
keywords = ["website", "audit", "security", "performance", "seo"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[[bin]]
name = "3rror"
path = "src/main.rs"

[dependencies]
# CLI argument parsing
clap = { version = "4.4", features = ["derive"] }

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Terminal colors and styling
colored = "2.1"

# Progress indicators
indicatif = "0.17"

# Error handling
anyhow = "1.0"

# Text wrapping
textwrap = "0.16"

# URL encoding
urlencoding = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
